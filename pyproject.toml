[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "recipient-guard"
version = "0.1.0"
description = "Open-source agent to reduce misdirected email and document breaches"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["."]
include = ["recipient_guard*"]
